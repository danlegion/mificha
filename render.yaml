# MiFicha en Render — plan gratuito.
# Despliegue: Render Dashboard -> New -> Blueprint -> conectar repo danlegion/mificha.
# Las variables marcadas sync:false se pegan a mano en el dashboard tras crear el servicio.
services:
  - type: web
    name: mificha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: OCR_PROVIDER
        value: tesseract
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
