# MiFicha on Render — free plan.
# Deploy: Render Dashboard -> New -> Blueprint -> connect repo danlegion/mificha.
# Variables marked sync:false are pasted by hand in the dashboard after creating the service.
services:
  - type: web
    name: mificha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: OCR_PROVIDER
        value: tesseract
      - key: DOCAI_PROCESSOR
        sync: false
      - key: DOCAI_CREDENTIALS_JSON
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
