{# Partial: tarjeta para subir y explicar un examen. Espera `titulo`. #}
<section id="explicar" class="card upload-card" aria-label="Explicar examen">
  <h2>{{ titulo }}</h2>
  <form action="/subir" method="post" enctype="multipart/form-data">
    {% if guest_token %}<input type="hidden" name="t" value="{{ guest_token }}">{% endif %}
    <label class="file-drop" for="archivo">
      <span class="file-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7l-5-5z"/>
          <path d="M14 2v5h5"/>
          <path d="M9 13h6M9 17h6"/>
        </svg>
      </span>
      <span class="file-text">Elige el PDF de tu examen</span>
      <span class="file-hint">Solo PDF · de tu celular o computadora</span>
      <input type="file" id="archivo" name="archivo" accept=".pdf" required>
    </label>
    <button class="btn btn-primary btn-large" type="submit" data-upload-btn>Explicar mi examen</button>
    {% if not user %}<p class="micro-note">Sin crear cuenta: ves tu explicación primero.</p>{% endif %}
  </form>
  <div class="upload-progress" hidden>
    <div class="upload-progress-track"><div class="upload-progress-bar"></div></div>
    <p class="upload-progress-text">Subiendo tu examen…</p>
  </div>
  <script>
  /* Subida con progreso: al aplastar el botón se muestra de inmediato
     el porcentaje real de subida y al terminar se sigue al redirect. */
  (function () {
    var root = document.currentScript.parentElement;
    var form = root.querySelector("form");
    var btn = form.querySelector("[data-upload-btn]");
    var prog = root.querySelector(".upload-progress");
    var bar = prog.querySelector(".upload-progress-bar");
    var txt = prog.querySelector(".upload-progress-text");
    var btnHtml = btn.innerHTML;
    var fileInput = form.querySelector('input[type="file"]');
    var fileText = form.querySelector(".file-text");
    var fileTextDefault = fileText.textContent;
    fileInput.addEventListener("change", function () {
      fileText.textContent = fileInput.files.length
        ? fileInput.files[0].name : fileTextDefault;
    });
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      btn.disabled = true;
      btn.innerHTML = "Subiendo tu examen…";
      prog.hidden = false;
      var xhr = new XMLHttpRequest();
      xhr.open("POST", form.action);
      xhr.upload.addEventListener("progress", function (e) {
        if (e.lengthComputable) {
          var pct = Math.round((e.loaded / e.total) * 100);
          bar.style.width = pct + "%";
          txt.textContent = "Subiendo tu examen… " + pct + "%";
        }
      });
      xhr.addEventListener("load", function () {
        if (xhr.status >= 200 && xhr.status < 400 && xhr.responseURL) {
          window.location.href = xhr.responseURL;  /* /procesando/... */
        } else if (xhr.status >= 400 && xhr.responseText) {
          document.open();
          document.write(xhr.responseText);
          document.close();
        } else {
          form.submit();  /* sin JS moderno: envío normal */
        }
      });
      xhr.addEventListener("error", function () {
        btn.disabled = false;
        btn.innerHTML = btnHtml;
        txt.textContent = "Se cortó la subida. Revisa tu conexión e intenta de nuevo.";
      });
      xhr.send(new FormData(form));
    });
  })();
  </script>
</section>
