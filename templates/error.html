{% extends "base.html" %}

{% block title %}Algo salió mal{% endblock %}

{% block content %}
<section class="card error-page">
  <h1>Ups, algo salió mal</h1>
  <p>{{ message }}</p>
  {% if detail %}<p class="micro-note">{{ detail }}</p>{% endif %}
  <div class="btn-row">
    <a class="btn btn-primary" href="/">Volver al inicio</a>
  </div>
</section>
{% endblock %}
